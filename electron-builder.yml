appId: io.github.zzsqjdhqgb.cyez-ls101
productName: 曹二听说101
directories:
  buildResources: build
fileAssociations:
  - ext: cyexam
    name: CYEZ 考试包
    description: CYEZ 考试包文件
    role: Editor
    mimeType: application/x-cyez-exam
    icon: assets/file-icons/cyexam.ico
  - ext: cytmpl
    name: CYEZ 模板包
    description: CYEZ 模板包文件
    role: Editor
    mimeType: application/x-cyez-template
    icon: assets/file-icons/cytmpl.ico
  - ext: cydraft
    name: CYEZ 草稿包
    description: CYEZ 草稿包文件
    role: Editor
    mimeType: application/x-cyez-draft
    icon: assets/file-icons/cydraft.ico
  - ext: cysubm
    name: CYEZ 作答包
    description: CYEZ 作答包文件
    role: Editor
    mimeType: application/x-cyez-submission
    icon: assets/file-icons/cysubm.ico
  - ext: cygrade
    name: CYEZ 批改记录包
    description: CYEZ 批改记录包文件
    role: Editor
    mimeType: application/x-cyez-grading
    icon: assets/file-icons/cygrade.ico
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - 'out/**/*'
  # Main-process dependencies are bundled by electron-vite. Keep only packages
  # that are loaded dynamically at runtime or contain native binaries.
  - '!**/node_modules/**/*'
  - 'node_modules/@electron-toolkit/utils/package.json'
  - 'node_modules/@electron-toolkit/utils/dist/index.cjs'
  - 'node_modules/fflate/package.json'
  - 'node_modules/fflate/lib/*.cjs'
  - 'node_modules/ffmpeg-static/{index.js,package.json,ffmpeg,ffmpeg.exe}'
  - 'node_modules/onnxruntime-common/package.json'
  - 'node_modules/onnxruntime-common/dist/cjs/*.{js,json}'
  - 'node_modules/onnxruntime-node/package.json'
  - 'node_modules/onnxruntime-node/dist/*.js'
  - 'node_modules/sherpa-onnx-node/package.json'
  - 'node_modules/sherpa-onnx-node/*.js'
  - 'node_modules/buffer-from/{index.js,package.json}'
  - 'node_modules/source-map/package.json'
  - 'node_modules/source-map/source-map.js'
  - 'node_modules/source-map/lib/*.js'
  - 'node_modules/source-map-support/{package.json,source-map-support.js}'
asarUnpack:
  - out/main/pronunciation-assessment-worker.js
  - out/main/pronunciation-assessment-worker.js.map
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-node/**
  - node_modules/sherpa-onnx-*/**
  - node_modules/ffmpeg-static/**
win:
  executableName: CYEZ-LS101
  icon: build/icon.png
  electronLanguages:
    - zh-CN
    - en-US
  files:
    - from: node_modules/onnxruntime-node/bin/napi-v6/win32/${arch}
      to: node_modules/onnxruntime-node/bin/napi-v6/win32/${arch}
      filter: '**/*'
    - from: node_modules/sherpa-onnx-win-${arch}
      to: node_modules/sherpa-onnx-win-${arch}
      filter: '**/*'
nsis:
  oneClick: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: true
  license: 'LICENSE'
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.png
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  files:
    - from: node_modules/onnxruntime-node/bin/napi-v6/darwin/${arch}
      to: node_modules/onnxruntime-node/bin/napi-v6/darwin/${arch}
      filter: '**/*'
    - from: node_modules/sherpa-onnx-darwin-${arch}
      to: node_modules/sherpa-onnx-darwin-${arch}
      filter: '**/*'
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  icon: build/icon.png
  maintainer: electronjs.org
  category: Utility
  electronLanguages:
    - zh-CN
    - en-US
  files:
    - from: node_modules/onnxruntime-node/bin/napi-v6/linux/${arch}
      to: node_modules/onnxruntime-node/bin/napi-v6/linux/${arch}
      filter: '**/*'
    - from: node_modules/sherpa-onnx-linux-${arch}
      to: node_modules/sherpa-onnx-linux-${arch}
      filter: '**/*'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
extraResources:
  - from: resources/tts
    to: tts
  - from: externals/ai/qwen3-tts/runtime
    to: qwen-tts
    filter:
      - '**/*'
      - '!**/ls101-qwen-tts-helper-cuda*'
      - '!**/cublas*.dll'
      - '!**/nvJitLink*.dll'
      - '!**/LICENSE.NVIDIA-CUDA.html'
  - from: resources/media
    to: media
  - from: resources/builtin
    to: builtin
  - from: docs/license-activation.html
    to: docs/license-activation.html
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: thirdparty-licenses
    to: thirdparty-licenses
