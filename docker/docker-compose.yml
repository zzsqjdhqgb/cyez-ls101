services:
  cyez-ls101-dev-docker:
    build: .
    container_name: cyez-ls101-dev-docker
    volumes:
      # 将当前目录（项目根目录）挂载到容器的 /workspace
      - ../:/workspace
      # 持久化 CLI 配置和 Electron keyring，避免重启后需要重新登录
      - local_data:/root/.local
      - codex_home:/root/.codex
      - claude_home:/root/.claude
      # DeepSeek Harness 的 profile、插件和运行时配置
      - dsh_home:/root/.dsh
      - yarn:/workspace/.yarn
      - yarn-cache:/yarn/store
      - node_modules:/workspace/node_modules
      - assets:/workspace/assets
      - /workspace/dist
      - /workspace/out
      - ../.git:/workspace/.git:ro
      - ../assets/.gitkeep:/workspace/assets/.gitkeep:ro
      - ../docker/:/workspace/docker/:ro
      # 复用 sbx 的 Docker Engine：挂载其 socket。
      # 信任边界在 sbx（完整内核的 Linux VM），容器与 sbx 之间不需要额外的 Docker 边界。
      # 若 sbx 的 socket 不在默认路径，用 docker/sbx-docker-doctor.sh 查出来后改这里。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    working_dir: /workspace
    shm_size: 1gb
    # 保持容器运行并支持交互式终端
    stdin_open: true
    tty: true
    # dsh web 默认监听 3080；通过环境变量可更换宿主机端口。
    ports:
      - "${DSH_PORT:-3080}:3000"
    # 自动重启（可选）

volumes:
  local_data:
  codex_home:
  claude_home:
  dsh_home:
  yarn:
  yarn-cache:
  node_modules:
  assets:
