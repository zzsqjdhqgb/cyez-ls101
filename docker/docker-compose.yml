services:
  cyez-ls101-dev-docker:
    build: .
    container_name: cyez-ls101-dev-docker
    volumes:
      # 将当前目录（项目根目录）挂载到容器的 /workspace
      - ../:/workspace
      # 持久化 CLI 配置和 Electron keyring，避免重启后需要重新登录
      - local_data:/root/.local
      - codex_home:/root/.codex
      - claude_home:/root/.claude
      - yarn:/workspace/.yarn
      - yarn-cache:/yarn/store
      - node_modules:/workspace/node_modules
      - assets:/workspace/assets
      - /workspace/dist
      - /workspace/out
      - ../.git:/workspace/.git:ro
      - ../assets/.gitkeep:/workspace/assets/.gitkeep:ro
      - ../docker/:/workspace/docker/:ro
    working_dir: /workspace
    shm_size: 1gb
    # 保持容器运行并支持交互式终端
    stdin_open: true
    tty: true
    # 自动重启（可选）

volumes:
  local_data:
  codex_home:
  claude_home:
  yarn:
  yarn-cache:
  node_modules:
  assets: