name: IndexTTS Assets

# Builds and publishes the IndexTTS native helpers and the split IndexTTS 2.5
# Q8_0 model assets. Mirrors qwen-tts.yml job for job.
#
# Bootstrap order (hard requirement): ci.yml runs `yarn install --immutable`
# whose postinstall executes scripts/setup.js, and setup fails on a fresh runner
# while `scripts/index-tts/assets.json` still says `published: false`. The
# intended sequence is:
#   1. From this feature branch, run this workflow with `workflow_dispatch`
#      (target=both) to build the four helpers, split the model, and publish
#      `index-tts-runtime-v0.1.0` and `index-tts-model-v1.0.0`. The first cuda
#      run can take hours; rerun it once to warm the sccache cache if it times
#      out (the timeout is 360 minutes for cuda legs).
#   2. Backfill assets.json: set `runtimeRelease.published: true` plus the
#      pinned cpu helper and runtime manifest entries (name/size/SHA-256) and
#      `modelRelease.published: true` (the part entries are already pinned).
#      Only the CPU helper is pinned; cuda assets ship but are never downloaded.
#   3. Commit the backfill. Full CI and `yarn test:smoke` only become
#      meaningful from that point on. Do not relax any pin to make setup green
#      before the releases exist.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Asset release to build and publish
        required: true
        default: both
        type: choice
        options:
          - runtime
          - model
          - both

permissions:
  contents: read

concurrency:
  group: index-tts-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Read asset configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime_version: ${{ steps.config.outputs.runtime_version }}
      runtime_tag: ${{ steps.config.outputs.runtime_tag }}
      runtime_prerelease: ${{ steps.config.outputs.runtime_prerelease }}
      model_version: ${{ steps.config.outputs.model_version }}
      model_tag: ${{ steps.config.outputs.model_tag }}
      model_prerelease: ${{ steps.config.outputs.model_prerelease }}
      runtime_repository: ${{ steps.config.outputs.runtime_repository }}
      runtime_revision: ${{ steps.config.outputs.runtime_revision }}
      runtime_ggml_revision: ${{ steps.config.outputs.runtime_ggml_revision }}
      model_id: ${{ steps.config.outputs.model_id }}
      model_revision: ${{ steps.config.outputs.model_revision }}
      model_gguf_repository: ${{ steps.config.outputs.model_gguf_repository }}
      model_gguf_revision: ${{ steps.config.outputs.model_gguf_revision }}
      model_upstream_path: ${{ steps.config.outputs.model_upstream_path }}
      model_size: ${{ steps.config.outputs.model_size }}
      model_sha256: ${{ steps.config.outputs.model_sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate bundle configuration
        id: config
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs')

          const file = 'scripts/index-tts/assets.json'
          const config = JSON.parse(readFileSync(file, 'utf8'))
          const fail = (message) => {
            throw new Error(`Invalid ${file}: ${message}`)
          }
          if (config.schemaVersion !== 1) fail('schemaVersion must be 1')
          const validateRelease = (name, prefix) => {
            const release = config[name]
            if (!/^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(release?.version ?? '')) {
              fail(`${name}.version must be a semantic version`)
            }
            if (release?.tag !== `${prefix}${release.version}`) {
              fail(`${name}.tag must match ${prefix}<version>`)
            }
            if (release?.repository !== process.env.CURRENT_REPOSITORY) {
              fail(`${name}.repository must be ${process.env.CURRENT_REPOSITORY}`)
            }
            if (typeof release?.prerelease !== 'boolean') {
              fail(`${name}.prerelease must be boolean`)
            }
            if (typeof release?.published !== 'boolean') {
              fail(`${name}.published must be boolean`)
            }
          }
          validateRelease('runtimeRelease', 'index-tts-runtime-v')
          validateRelease('modelRelease', 'index-tts-model-v')
          if (!/^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(config.package?.version ?? '')) {
            fail('package.version must be a semantic version')
          }
          if (!/^https:\/\/github\.com\/.+\.git$/.test(config.runtime?.repository ?? '')) {
            fail('runtime.repository must be a GitHub HTTPS clone URL')
          }
          if (config.model?.id !== 'IndexTeam/IndexTTS-2.5') {
            fail('model.id must be IndexTeam/IndexTTS-2.5')
          }
          for (const [name, revision] of [
            ['runtime.revision', config.runtime?.revision],
            ['runtime.ggmlRevision', config.runtime?.ggmlRevision],
            ['model.revision', config.model?.revision],
            ['model.ggufRevision', config.model?.ggufRevision]
          ]) {
            if (!/^[a-f0-9]{40}$/.test(revision ?? '')) fail(`${name} must be a full commit hash`)
          }
          if (config.model?.quantization !== 'q8_0') fail('model.quantization must be q8_0')
          if (!Number.isSafeInteger(config.model?.size) || config.model.size <= 0) {
            fail('model.size must be a positive integer')
          }
          if (!/^[a-f0-9]{64}$/.test(config.model?.sha256 ?? '')) {
            fail('model.sha256 must be a SHA-256 digest')
          }
          if (!config.model?.ggufRepository || !config.model?.upstreamPath) {
            fail('model.ggufRepository and model.upstreamPath are required')
          }
          if (!Array.isArray(config.voices) || !config.voices.length) fail('voices must not be empty')
          const voiceIds = new Set()
          for (const voice of config.voices) {
            if (!/^[a-zA-Z0-9_.-]+$/.test(voice?.id ?? '')) fail('voice.id is invalid')
            if (voiceIds.has(voice.id)) fail(`duplicate voice.id: ${voice.id}`)
            voiceIds.add(voice.id)
            if (typeof voice.name !== 'string' || !voice.name.trim()) fail('voice.name is invalid')
            if (!existsSync(voice.file ?? '')) fail(`voice.file does not exist: ${voice.file}`)
            if (!existsSync(voice.provenance ?? '')) {
              fail(`voice.provenance does not exist: ${voice.provenance}`)
            }
          }
          // The model part list is the split recipe: 1 GiB parts in byte order
          // with the final part as the remainder, each pinned by SHA-256.
          const partBytes = 1073741824
          const expectedPartSizes = []
          for (let offset = 0; offset < config.model.size; offset += partBytes) {
            expectedPartSizes.push(Math.min(partBytes, config.model.size - offset))
          }
          const parts = config.modelRelease?.parts ?? []
          if (
            !Array.isArray(parts) ||
            parts.length !== expectedPartSizes.length ||
            parts.some((part, index) =>
              !part ||
              part.name !== `index-tts2_5-q8_0.gguf.part-${String(index + 1).padStart(4, '0')}` ||
              part.size !== expectedPartSizes[index] ||
              !/^[a-f0-9]{64}$/.test(part.sha256 ?? '')
            )
          ) {
            fail('modelRelease.parts must describe the deterministic 1 GiB split with SHA-256 pins')
          }
          const total = parts.reduce((sum, part) => sum + part.size, 0)
          if (total !== config.model.size) {
            fail('modelRelease.parts sizes must add up to model.size')
          }

          const outputs = {
            runtime_version: config.runtimeRelease.version,
            runtime_tag: config.runtimeRelease.tag,
            runtime_prerelease: String(config.runtimeRelease.prerelease),
            model_version: config.modelRelease.version,
            model_tag: config.modelRelease.tag,
            model_prerelease: String(config.modelRelease.prerelease),
            runtime_repository: config.runtime.repository,
            runtime_revision: config.runtime.revision,
            runtime_ggml_revision: config.runtime.ggmlRevision,
            model_id: config.model.id,
            model_revision: config.model.revision,
            model_gguf_repository: config.model.ggufRepository,
            model_gguf_revision: config.model.ggufRevision,
            model_upstream_path: config.model.upstreamPath,
            model_size: String(config.model.size),
            model_sha256: config.model.sha256
          }
          for (const [name, value] of Object.entries(outputs)) {
            if (typeof value !== 'string' || !value || value.includes('\n')) {
              fail(`${name} is invalid`)
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`)
          }
          console.log(`${outputs.runtime_tag} and ${outputs.model_tag} configuration is valid`)
          NODE

  build:
    name: Build ${{ matrix.runtime-directory }} ${{ matrix.backend }}
    needs: metadata
    if: ${{ inputs.target == 'runtime' || inputs.target == 'both' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against the oldest supported hosted Linux image so the helper
          # does not require the newer GLIBC symbols from ubuntu-latest.
          - runner: ubuntu-22.04
            runtime-directory: linux-x64
            backend: cpu
            executable: ls101-index-tts-helper-cpu
            release-asset: ls101-index-tts-helper-cpu-linux-x64
          - runner: ubuntu-22.04
            runtime-directory: linux-x64
            backend: cuda
            executable: ls101-index-tts-helper-cuda
            release-asset: ls101-index-tts-helper-cuda-linux-x64
          # CUDA 12.8 supports MSVC 193x / Visual Studio 2022. Pin both
          # Windows variants so the CPU and CUDA helpers use the same toolchain.
          - runner: windows-2022
            runtime-directory: win32-x64
            backend: cpu
            executable: ls101-index-tts-helper-cpu.exe
            release-asset: ls101-index-tts-helper-cpu-win32-x64.exe
          - runner: windows-2022
            runtime-directory: win32-x64
            backend: cuda
            executable: ls101-index-tts-helper-cuda.exe
            release-asset: ls101-index-tts-helper-cuda-win32-x64.exe
    runs-on: ${{ matrix.runner }}
    # audio.cpp's ggml-cuda kernel volume is far larger than qwen3-tts.cpp, so
    # cuda legs get the platform maximum; sccache plus the trimmed architecture
    # list keeps reruns much shorter.
    timeout-minutes: ${{ matrix.backend == 'cuda' && 360 || 120 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up CUDA compiler cache
        if: matrix.backend == 'cuda'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Show native toolchain
        shell: bash
        run: |
          cmake --version
          git --version
          node --version

      - name: Set up CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          # Both platforms use a component allowlist. audio.cpp additionally
          # needs cuFFT for the BigVGAN/STFT path, so qwen's list gains the
          # cufft components; skip samples, profilers, docs, Nsight, and VS
          # project integration.
          method: network
          sub-packages: >-
            ${{ runner.os == 'Windows' && '["nvcc","cudart","cublas","cublas_dev","cufft","cufft_dev","nvjitlink","thrust"]' || '["nvcc"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Windows' && '[]' || '["libcublas","libcublas-dev","libcufft","libcufft-dev","libnvjitlink"]' }}

      - name: Build runtime
        if: runner.os != 'Windows'
        env:
          SCCACHE_GHA_ENABLED: ${{ matrix.backend == 'cuda' && 'true' || 'false' }}
        run: |
          echo "CUDA_PATH=${CUDA_PATH:-unset}"
          node scripts/index-tts/build-runtime.mjs --backend ${{ matrix.backend }}

      - name: Build runtime on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INDEX_TTS_CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: ${{ matrix.backend == 'cuda' && 'true' || 'false' }}
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          echo CUDA_PATH=%CUDA_PATH%
          node scripts/index-tts/build-runtime.mjs --backend ${{ matrix.backend }}

      - name: Prepare bundled Windows CUDA DLLs for smoke test
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        shell: pwsh
        run: |
          # ggml-cuda links cudart statically but cuBLAS dynamically, and
          # audio.cpp's engine_runtime dynamically links cudart and cuFFT, so
          # the helper needs this fixed closure beside it to start:
          # cublas64_12.dll -> cublasLt64_12.dll -> nvJitLink_120_0.dll plus
          # cudart64_12.dll and cufft64_11.dll.
          $sourceDirectory = Join-Path $env:CUDA_PATH 'bin'
          $destinationDirectory = 'externals/ai/index-tts/runtime/win32-x64'
          foreach ($name in @('cublas64_12.dll', 'cublasLt64_12.dll', 'cudart64_12.dll', 'cufft64_11.dll', 'nvJitLink_120_0.dll')) {
            $source = Join-Path $sourceDirectory $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "CUDA runtime dependency is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destinationDirectory $name)
          }

      - name: Smoke-test helper
        shell: bash
        env:
          HELPER_PATH: externals/ai/index-tts/runtime/${{ matrix.runtime-directory }}/${{ matrix.executable }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const { statSync } = require('node:fs')

          const helper = process.env.HELPER_PATH
          const stats = statSync(helper)
          if (!stats.isFile() || stats.size < 1_000_000) {
            throw new Error(`Built helper is unexpectedly small: ${stats.size} bytes`)
          }
          // Runs with no arguments on every leg including cuda builds: the
          // missing --model exit happens before engine initialization, so no
          // GPU is required on hosted runners.
          const result = spawnSync(helper, [], { encoding: 'utf8' })
          if (
            result.status !== 1 ||
            !result.stderr?.includes('An absolute --model path is required')
          ) {
            const status =
              result.status === null
                ? 'null'
                : `${result.status} (0x${(result.status >>> 0).toString(16)})`
            throw new Error(
              `Helper smoke test failed (status=${status}, signal=${result.signal ?? 'none'}): ` +
                `${result.stderr || result.stdout || result.error || 'no process output'}`
            )
          }
          console.log(`Validated ${helper} (${stats.size} bytes)`)
          NODE

      - name: Stage runtime asset
        shell: bash
        env:
          SOURCE_PATH: externals/ai/index-tts/runtime/${{ matrix.runtime-directory }}/${{ matrix.executable }}
          RELEASE_ASSET: ${{ matrix.release-asset }}
          RUNTIME_DIRECTORY: ${{ matrix.runtime-directory }}
          RUNTIME_BACKEND: ${{ matrix.backend }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-assets
          cp "$SOURCE_PATH" "release-assets/$RELEASE_ASSET"
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync, writeFileSync } = require('node:fs')

          const config = JSON.parse(readFileSync('scripts/index-tts/assets.json', 'utf8'))
          const info = {
            schemaVersion: 1,
            runtimeDirectory: process.env.RUNTIME_DIRECTORY,
            backend: process.env.RUNTIME_BACKEND,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: {
              repository: config.runtime.repository,
              revision: execFileSync(
                'git',
                ['-C', 'externals/ai/index-tts/downloads/audio.cpp', 'rev-parse', 'HEAD'],
                { encoding: 'utf8' }
              ).trim(),
              // external/ggml is vendored in the tree, so this is a tree hash.
              ggmlRevision: execFileSync(
                'git',
                ['-C', 'externals/ai/index-tts/downloads/audio.cpp', 'rev-parse', 'HEAD:external/ggml'],
                { encoding: 'utf8' }
              ).trim()
            }
          }
          writeFileSync(
            `release-assets/build-info-${process.env.RUNTIME_DIRECTORY}-${process.env.RUNTIME_BACKEND}.json`,
            `${JSON.stringify(info, null, 2)}\n`
          )
          NODE

      - name: Stage Windows CUDA runtime dependencies
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        shell: pwsh
        run: |
          # The same fixed closure prepared for the smoke test; cuDART is a
          # thin loader (< 1 MB in CUDA 12.8), so it keeps the 100 KB floor
          # the smoke test uses for the helper instead of the 1 MB floor.
          $sourceDirectory = Join-Path $env:CUDA_PATH 'bin'
          $destinationDirectory = 'release-assets'
          $cudaRuntimeFiles = @(
            @{ Name = 'cublas64_12.dll'; MinimumBytes = 1MB },
            @{ Name = 'cublasLt64_12.dll'; MinimumBytes = 1MB },
            @{ Name = 'cudart64_12.dll'; MinimumBytes = 100KB },
            @{ Name = 'cufft64_11.dll'; MinimumBytes = 1MB },
            @{ Name = 'nvJitLink_120_0.dll'; MinimumBytes = 1MB }
          )
          foreach ($file in $cudaRuntimeFiles) {
            $source = Join-Path $sourceDirectory $file.Name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "CUDA runtime dependency is missing: $source"
            }
            if ((Get-Item -LiteralPath $source).Length -lt $file.MinimumBytes) {
              throw "CUDA runtime dependency is unexpectedly small: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destinationDirectory $file.Name)
          }

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v6
        with:
          name: index-tts-runtime-${{ matrix.runtime-directory }}-${{ matrix.backend }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  model:
    name: Build Q8_0 model assets
    needs: metadata
    if: ${{ inputs.target == 'model' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download and split the pinned model
        shell: bash
        env:
          MODEL_ID: ${{ needs.metadata.outputs.model_id }}
          MODEL_REVISION: ${{ needs.metadata.outputs.model_revision }}
          MODEL_GGUF_REPOSITORY: ${{ needs.metadata.outputs.model_gguf_repository }}
          MODEL_GGUF_REVISION: ${{ needs.metadata.outputs.model_gguf_revision }}
          MODEL_UPSTREAM_PATH: ${{ needs.metadata.outputs.model_upstream_path }}
          MODEL_SIZE: ${{ needs.metadata.outputs.model_size }}
          MODEL_SHA256: ${{ needs.metadata.outputs.model_sha256 }}
        run: |
          mkdir -p release-assets
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { createReadStream, createWriteStream } = require('node:fs')
          const { once } = require('node:events')
          const { finished } = require('node:stream/promises')
          const { readFileSync, statSync, writeFileSync } = require('node:fs')
          const path = require('node:path')

          const config = JSON.parse(readFileSync('scripts/index-tts/assets.json', 'utf8'))
          const expectedSize = Number(process.env.MODEL_SIZE)
          const expectedSha256 = process.env.MODEL_SHA256
          const upstreamUrl =
            `https://huggingface.co/${process.env.MODEL_GGUF_REPOSITORY}` +
            `/resolve/${process.env.MODEL_GGUF_REVISION}/${process.env.MODEL_UPSTREAM_PATH}`
          const modelPath = 'release-assets/index-tts2_5-q8_0.gguf'

          async function download(url, destination) {
            const response = await fetch(url)
            if (!response.ok || !response.body) {
              throw new Error(`model download failed (HTTP ${response.status}): ${url}`)
            }
            const output = createWriteStream(destination, { flags: 'wx' })
            let blocked = null
            for await (const chunk of response.body) {
              if (!output.write(chunk)) blocked = once(output, 'drain')
              if (blocked) {
                await blocked
                blocked = null
              }
            }
            output.end()
            await finished(output)
          }

          ;(async () => {
            await download(upstreamUrl, modelPath)
            const stats = statSync(modelPath)
            if (stats.size !== expectedSize) {
              throw new Error(`model size mismatch: ${stats.size} (expected ${expectedSize})`)
            }
            const hash = createHash('sha256')
            for await (const chunk of createReadStream(modelPath)) hash.update(chunk)
            const digest = hash.digest('hex')
            if (digest !== expectedSha256) {
              throw new Error(`model SHA-256 mismatch: ${digest} (expected ${expectedSha256})`)
            }

            // Deterministic split: 1 GiB parts in byte order, last part is the
            // remainder. Each part is hashed as the correctness self-check.
            // assets.json pins name/size/sha256 only, so offsets are computed
            // from the running total instead of a (nonexistent) part.offset.
            const parts = []
            let partOffset = 0
            for (const part of config.modelRelease.parts) {
              const partPath = path.join('release-assets', part.name)
              const input = createReadStream(modelPath, {
                start: partOffset,
                end: partOffset + part.size - 1
              })
              const output = createWriteStream(partPath, { flags: 'wx' })
              const hash = createHash('sha256')
              let blocked = null
              let written = 0
              for await (const chunk of input) {
                hash.update(chunk)
                written += chunk.byteLength
                if (!output.write(chunk)) blocked = once(output, 'drain')
                if (blocked) {
                  await blocked
                  blocked = null
                }
              }
              output.end()
              await finished(output)
              if (written !== part.size) {
                throw new Error(`part size mismatch: ${part.name} (${written}, expected ${part.size})`)
              }
              const partDigest = hash.digest('hex')
              if (partDigest !== part.sha256) {
                throw new Error(
                  `part SHA-256 mismatch: ${part.name} (${partDigest}, expected ${part.sha256})`
                )
              }
              parts.push({ name: part.name, bytes: part.size })
              console.log(`split ${part.name} (${part.size} bytes, sha256=${partDigest})`)
              partOffset += part.size
            }
            if (partOffset !== expectedSize) {
              throw new Error(`parts cover ${partOffset} bytes, expected ${expectedSize}`)
            }
            // GitHub caps each Release asset at 2 GiB; every part must stay
            // below it (the merged model is only reassembled by consumers).
            for (const part of parts) {
              if (part.bytes >= 2 * 1024 ** 3) {
                throw new Error(
                  `Model part exceeds GitHub's 2 GiB asset limit: ${part.name} (${part.bytes})`
                )
              }
            }

            const info = {
              schemaVersion: 1,
              sourceCommit: process.env.GITHUB_SHA,
              modelId: process.env.MODEL_ID,
              modelRevision: process.env.MODEL_REVISION,
              upstreamUrl,
              assets: parts
            }
            writeFileSync(
              'release-assets/model-build-info.json',
              `${JSON.stringify(info, null, 2)}\n`
            )
            console.log(`Staged ${parts.map((part) => part.name).join(', ')}`)
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error)
            process.exit(1)
          })
          NODE

      - name: Stage license notices
        shell: bash
        run: |
          cp native/index-tts/licenses/LICENSE.IndexTTS.txt release-assets/
          cp native/index-tts/licenses/DISCLAIMER.IndexTTS.txt release-assets/
          cp native/index-tts/licenses/LICENSE.audio-cpp.txt release-assets/
          cp thirdparty-licenses/LICENSE.ggml.txt release-assets/

      - name: Upload model artifact
        uses: actions/upload-artifact@v6
        with:
          name: index-tts-model-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release-runtime:
    name: Publish IndexTTS runtime
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download runtime artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: index-tts-runtime-*
          path: release-assets
          merge-multiple: true

      - name: Generate runtime manifest
        env:
          RUNTIME_VERSION: ${{ needs.metadata.outputs.runtime_version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.runtime_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cp thirdparty-licenses/LICENSE.ggml.txt release-assets/
          cp native/index-tts/licenses/LICENSE.audio-cpp.txt release-assets/
          curl --fail --location --silent --show-error \
            https://docs.nvidia.com/cuda/eula/index.html \
            --output release-assets/LICENSE.NVIDIA-CUDA.html
          node <<'NODE'
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs')
          const path = require('node:path')

          const directory = 'release-assets'
          const buildInfoFiles = readdirSync(directory)
            .filter((name) => name.startsWith('build-info-') && name.endsWith('.json'))
            .sort()
          if (buildInfoFiles.length !== 4) {
            throw new Error(`Expected four build-info files, found ${buildInfoFiles.length}`)
          }
          const buildInfo = buildInfoFiles.map((name) =>
            JSON.parse(readFileSync(path.join(directory, name), 'utf8'))
          )
          const first = buildInfo[0]
          for (const current of buildInfo) {
            if (
              current.sourceCommit !== process.env.SOURCE_COMMIT ||
              current.upstream.repository !== first.upstream.repository ||
              current.upstream.revision !== first.upstream.revision ||
              current.upstream.ggmlRevision !== first.upstream.ggmlRevision
            ) {
              throw new Error('Platform builds used different source revisions')
            }
          }
          const runtimeFiles = readdirSync(directory)
            .filter((name) => name.startsWith('ls101-index-tts-helper-'))
            .sort()
          const expectedRuntimeFiles = [
            'ls101-index-tts-helper-cpu-linux-x64',
            'ls101-index-tts-helper-cpu-win32-x64.exe',
            'ls101-index-tts-helper-cuda-linux-x64',
            'ls101-index-tts-helper-cuda-win32-x64.exe'
          ].sort()
          if (JSON.stringify(runtimeFiles) !== JSON.stringify(expectedRuntimeFiles)) {
            throw new Error(`Unexpected runtime assets: ${runtimeFiles.join(', ')}`)
          }
          // The Windows cuda leg stages the fixed DLL closure; mirror the
          // build list exactly. cuDART is a thin loader (< 1 MB in CUDA 12.8),
          // so it keeps the 100 KB floor instead of the 1 MB floor.
          const dependencyFiles = readdirSync(directory)
            .filter((name) => name.endsWith('.dll'))
            .sort()
          const expectedDependencyFiles = [
            'cublas64_12.dll',
            'cublasLt64_12.dll',
            'cudart64_12.dll',
            'cufft64_11.dll',
            'nvJitLink_120_0.dll'
          ].sort()
          if (JSON.stringify(dependencyFiles) !== JSON.stringify(expectedDependencyFiles)) {
            throw new Error(`Unexpected Windows CUDA dependencies: ${dependencyFiles.join(', ')}`)
          }
          const dependencyMinimumBytes = {
            'cudart64_12.dll': 100 * 1024
          }
          for (const name of dependencyFiles) {
            const minimumBytes = dependencyMinimumBytes[name] ?? 1024 * 1024
            if (statSync(path.join(directory, name)).size < minimumBytes) {
              throw new Error(`Windows CUDA dependency is unexpectedly small: ${name}`)
            }
          }
          const licenseFiles = [
            'LICENSE.NVIDIA-CUDA.html',
            'LICENSE.ggml.txt',
            'LICENSE.audio-cpp.txt'
          ]
          const assets = runtimeFiles.map((name) => ({
            kind: 'native-runtime',
            runtimeDirectory: name.includes('-win32-') ? 'win32-x64' : 'linux-x64',
            backend: name.includes('-cuda-') ? 'cuda' : 'cpu',
            name
          }))
          assets.push(
            ...dependencyFiles.map((name) => ({
              kind: 'native-runtime-dependency',
              runtimeDirectory: 'win32-x64',
              backend: 'cuda',
              name
            }))
          )
          assets.push(...licenseFiles.map((name) => ({ kind: 'license', name })))
          const manifest = {
            schemaVersion: 1,
            runtimeVersion: process.env.RUNTIME_VERSION,
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: first.upstream,
            assets
          }
          writeFileSync(
            path.join(directory, 'index-tts-runtime-manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          )
          NODE
          cat release-assets/index-tts-runtime-manifest.json

      - name: Require an unused runtime tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.runtime_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag or release $RELEASE_TAG already exists; publish a new runtime version"
            exit 1
          fi

      - name: Create runtime release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.runtime_tag }}
          target_commitish: ${{ github.sha }}
          name: IndexTTS Runtime v${{ needs.metadata.outputs.runtime_version }}
          prerelease: ${{ needs.metadata.outputs.runtime_prerelease }}
          make_latest: false
          generate_release_notes: false
          body: |
            CPU and NVIDIA CUDA native IndexTTS helpers for Linux x64 and Windows x64.
            Both backends are published; the application only uses the CPU helper, and
            CUDA assets are excluded from application packages. The Windows CUDA build
            bundles the cuBLAS/cuDART/cuFFT/nvJitLink runtime DLLs the helper needs;
            the Linux CUDA build statically links cuBLAS/cuBLASLt and requires a CUDA
            12.8 runtime (libcudart.so.12, libcufft.so.11) on the system.

            Runtime and source revisions are recorded in `index-tts-runtime-manifest.json`.
            This release is immutable; publish a new runtime version for any binary change.
          files: |
            release-assets/ls101-index-tts-helper-*
            release-assets/*.dll
            release-assets/LICENSE.NVIDIA-CUDA.html
            release-assets/LICENSE.ggml.txt
            release-assets/LICENSE.audio-cpp.txt
            release-assets/index-tts-runtime-manifest.json
          fail_on_unmatched_files: true
          overwrite_files: false

  release-model:
    name: Publish IndexTTS model
    needs: [metadata, model]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download model artifacts
        uses: actions/download-artifact@v7
        with:
          name: index-tts-model-assets
          path: release-assets

      - name: Generate model manifest
        env:
          MODEL_VERSION: ${{ needs.metadata.outputs.model_version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.model_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs')
          const path = require('node:path')

          const directory = 'release-assets'
          const modelInfo = JSON.parse(
            readFileSync(path.join(directory, 'model-build-info.json'), 'utf8')
          )
          if (modelInfo.sourceCommit !== process.env.SOURCE_COMMIT) {
            throw new Error('Model asset source commit does not match the workflow commit')
          }
          const partFiles = readdirSync(directory)
            .filter((name) => /^index-tts2_5-q8_0\.gguf\.part-\d{4}$/.test(name))
            .sort()
          const expectedPartFiles = [
            'index-tts2_5-q8_0.gguf.part-0001',
            'index-tts2_5-q8_0.gguf.part-0002',
            'index-tts2_5-q8_0.gguf.part-0003',
            'index-tts2_5-q8_0.gguf.part-0004'
          ].sort()
          if (
            JSON.stringify(partFiles) !== JSON.stringify(expectedPartFiles) ||
            JSON.stringify(modelInfo.assets.map((asset) => asset.name).sort()) !==
              JSON.stringify(expectedPartFiles)
          ) {
            throw new Error(`Unexpected model assets: ${partFiles.join(', ')}`)
          }
          for (const asset of modelInfo.assets) {
            if (statSync(path.join(directory, asset.name)).size !== asset.bytes) {
              throw new Error(`Model asset size changed after staging: ${asset.name}`)
            }
            if (asset.bytes >= 2 * 1024 ** 3) {
              throw new Error(`Model asset exceeds GitHub's 2 GiB asset limit: ${asset.name}`)
            }
          }
          const mergedSize = modelInfo.assets.reduce((sum, asset) => sum + asset.bytes, 0)
          const licenseFiles = [
            'LICENSE.IndexTTS.txt',
            'DISCLAIMER.IndexTTS.txt',
            'LICENSE.audio-cpp.txt',
            'LICENSE.ggml.txt'
          ]
          const assets = partFiles.map((name) => ({ kind: 'model-part', name }))
          assets.push(...licenseFiles.map((name) => ({ kind: 'license', name })))
          const manifest = {
            schemaVersion: 1,
            modelVersion: process.env.MODEL_VERSION,
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: {
              model: modelInfo.modelId,
              modelRevision: modelInfo.modelRevision,
              ggufRepository: modelInfo.upstreamUrl
                .split('/resolve')[0]
                .replace('https://huggingface.co/', ''),
              size: mergedSize,
              sha256: JSON.parse(readFileSync('scripts/index-tts/assets.json', 'utf8')).model.sha256
            },
            assets
          }
          writeFileSync(
            path.join(directory, 'index-tts-model-manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          )
          NODE
          rm release-assets/index-tts2_5-q8_0.gguf
          rm release-assets/model-build-info.json
          cat release-assets/index-tts-model-manifest.json

      - name: Require an unused model tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.model_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag or release $RELEASE_TAG already exists; publish a new model version"
            exit 1
          fi

      - name: Create model release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.model_tag }}
          target_commitish: ${{ github.sha }}
          name: IndexTTS Model v${{ needs.metadata.outputs.model_version }}
          prerelease: ${{ needs.metadata.outputs.model_prerelease }}
          make_latest: false
          generate_release_notes: false
          body: |
            IndexTTS 2.5 Q8_0 GGUF split into four byte-ordered parts
            (1 GiB each with the final part as the remainder). Concatenate the parts
            in order to reconstruct the 3,502,955,328-byte model; the whole-file
            SHA-256 is pinned in the application's assets.json.

            Model weights are distributed under the bilibili Model Use License
            (conditional commercial use); see LICENSE.IndexTTS.txt and
            DISCLAIMER.IndexTTS.txt. Revisions are recorded in
            `index-tts-model-manifest.json`. This release is immutable; publish a
            new model version when the GGUF changes.
          files: |
            release-assets/index-tts2_5-q8_0.gguf.part-*
            release-assets/LICENSE.*.txt
            release-assets/DISCLAIMER.*.txt
            release-assets/index-tts-model-manifest.json
          fail_on_unmatched_files: true
          overwrite_files: false
