name: Canonical Product Documentation

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-docs-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical-docs:
    name: Canonical product docs (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read renderer version
        id: renderer
        shell: bash
        run: |
          version="$(tr -d '\r\n' < docker/product-docs/renderer-version)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid product documentation renderer version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ls101-product-docs-renderer:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical renderer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/product-docs/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.renderer.outputs.image }}
          cache-from: type=gha,scope=product-docs-renderer
          cache-to: type=gha,mode=max,scope=product-docs-renderer

      - name: Check canonical product documentation
        env:
          LS101_PRODUCT_DOCS_PREBUILT_IMAGE: '1'
        run: node scripts/product-docs/docker.mjs check

      - name: Upload generated documentation on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-product-docs-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            docs/product/
            docs/engineering/testing/inventory.md
