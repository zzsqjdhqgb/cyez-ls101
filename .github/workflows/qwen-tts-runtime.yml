name: Qwen TTS Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime release version (for example, 0.1.0)
        required: true
        default: 0.1.0
        type: string
      prerelease:
        description: Mark the runtime release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: qwen-tts-runtime-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.runtime-directory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime-directory: linux-x64
            executable: ls101-qwen-tts-helper
            release-asset: ls101-qwen-tts-helper-linux-x64
          - runner: windows-latest
            runtime-directory: win32-x64
            executable: ls101-qwen-tts-helper.exe
            release-asset: ls101-qwen-tts-helper-win32-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release version
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid runtime version: $RUNTIME_VERSION"
            exit 1
          fi

      - name: Show native toolchain
        shell: bash
        run: |
          cmake --version
          git --version
          node --version

      - name: Build CPU runtime
        run: node scripts/build-qwen-tts-runtime.mjs

      - name: Smoke-test helper
        shell: bash
        env:
          HELPER_PATH: resources/qwen-tts/${{ matrix.runtime-directory }}/${{ matrix.executable }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const { statSync } = require('node:fs')

          const helper = process.env.HELPER_PATH
          const stats = statSync(helper)
          if (!stats.isFile() || stats.size < 100_000) {
            throw new Error(`Built helper is unexpectedly small: ${stats.size} bytes`)
          }
          const result = spawnSync(helper, [], { encoding: 'utf8' })
          if (result.status !== 2 || !result.stderr.includes('Usage:')) {
            throw new Error(
              `Helper smoke test failed (status=${result.status}): ${result.stderr || result.error}`
            )
          }
          console.log(`Validated ${helper} (${stats.size} bytes)`)
          NODE

      - name: Stage runtime asset
        shell: bash
        env:
          SOURCE_PATH: resources/qwen-tts/${{ matrix.runtime-directory }}/${{ matrix.executable }}
          RELEASE_ASSET: ${{ matrix.release-asset }}
          RUNTIME_DIRECTORY: ${{ matrix.runtime-directory }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-assets
          cp "$SOURCE_PATH" "release-assets/$RELEASE_ASSET"
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { writeFileSync } = require('node:fs')

          const revision = (directory) =>
            execFileSync('git', ['-C', directory, 'rev-parse', 'HEAD'], {
              encoding: 'utf8'
            }).trim()
          const info = {
            schemaVersion: 1,
            runtimeDirectory: process.env.RUNTIME_DIRECTORY,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: {
              repository: 'https://github.com/predict-woo/qwen3-tts.cpp',
              revision: revision('.cache/qwen3-tts.cpp'),
              ggmlRevision: revision('.cache/qwen3-tts.cpp/ggml')
            }
          }
          writeFileSync(
            `release-assets/build-info-${process.env.RUNTIME_DIRECTORY}.json`,
            `${JSON.stringify(info, null, 2)}\n`
          )
          NODE

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-tts-runtime-${{ matrix.runtime-directory }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish runtime release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download runtime artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: qwen-tts-runtime-*
          path: release-assets
          merge-multiple: true

      - name: Generate pinned runtime manifest
        env:
          RUNTIME_VERSION: ${{ inputs.version }}
          RELEASE_TAG: qwen-tts-runtime-v${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs')
          const path = require('node:path')

          const directory = 'release-assets'
          const buildInfoFiles = readdirSync(directory)
            .filter((name) => name.startsWith('build-info-') && name.endsWith('.json'))
            .sort()
          if (buildInfoFiles.length !== 2) {
            throw new Error(`Expected two build-info files, found ${buildInfoFiles.length}`)
          }
          const buildInfo = buildInfoFiles.map((name) =>
            JSON.parse(readFileSync(path.join(directory, name), 'utf8'))
          )
          const first = buildInfo[0]
          for (const current of buildInfo.slice(1)) {
            if (
              current.sourceCommit !== first.sourceCommit ||
              current.upstream.revision !== first.upstream.revision ||
              current.upstream.ggmlRevision !== first.upstream.ggmlRevision
            ) {
              throw new Error('Platform builds used different source revisions')
            }
          }

          const assetFiles = readdirSync(directory)
            .filter((name) => name.startsWith('ls101-qwen-tts-helper-'))
            .sort()
          if (assetFiles.length !== 2) {
            throw new Error(`Expected two runtime assets, found ${assetFiles.length}`)
          }
          const sha256 = (file) =>
            createHash('sha256').update(readFileSync(file)).digest('hex')
          const assets = assetFiles.map((name) => {
            const file = path.join(directory, name)
            const runtimeDirectory = name.includes('-win32-') ? 'win32-x64' : 'linux-x64'
            return { runtimeDirectory, name, size: statSync(file).size, sha256: sha256(file) }
          })
          const manifest = {
            schemaVersion: 1,
            runtimeVersion: process.env.RUNTIME_VERSION,
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: first.upstream,
            assets
          }
          writeFileSync(
            path.join(directory, 'qwen-tts-runtime-manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          )
          NODE
          cd release-assets
          sha256sum ls101-qwen-tts-helper-* qwen-tts-runtime-manifest.json > SHA256SUMS
          cat qwen-tts-runtime-manifest.json
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: qwen-tts-runtime-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Qwen TTS Runtime v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          generate_release_notes: false
          body: |
            CPU-only native helpers for Qwen3-TTS 12Hz 0.6B Base.

            These executables are built from the source commit recorded in
            `qwen-tts-runtime-manifest.json`. Model weights are distributed separately.
          files: |
            release-assets/ls101-qwen-tts-helper-*
            release-assets/qwen-tts-runtime-manifest.json
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
