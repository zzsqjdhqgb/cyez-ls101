name: Qwen TTS Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle release version (for example, 0.1.0)
        required: true
        default: 0.1.0
        type: string
      prerelease:
        description: Mark the bundle release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: qwen-tts-bundle-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.runtime-directory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime-directory: linux-x64
            executable: ls101-qwen-tts-helper
            release-asset: ls101-qwen-tts-helper-linux-x64
          - runner: windows-latest
            runtime-directory: win32-x64
            executable: ls101-qwen-tts-helper.exe
            release-asset: ls101-qwen-tts-helper-win32-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release version
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid runtime version: $RUNTIME_VERSION"
            exit 1
          fi

      - name: Show native toolchain
        shell: bash
        run: |
          cmake --version
          git --version
          node --version

      - name: Build CPU runtime
        run: node scripts/build-qwen-tts-runtime.mjs

      - name: Smoke-test helper
        shell: bash
        env:
          HELPER_PATH: resources/qwen-tts/${{ matrix.runtime-directory }}/${{ matrix.executable }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const { statSync } = require('node:fs')

          const helper = process.env.HELPER_PATH
          const stats = statSync(helper)
          if (!stats.isFile() || stats.size < 100_000) {
            throw new Error(`Built helper is unexpectedly small: ${stats.size} bytes`)
          }
          const result = spawnSync(helper, [], { encoding: 'utf8' })
          if (result.status !== 2 || !result.stderr.includes('Usage:')) {
            throw new Error(
              `Helper smoke test failed (status=${result.status}): ${result.stderr || result.error}`
            )
          }
          console.log(`Validated ${helper} (${stats.size} bytes)`)
          NODE

      - name: Stage runtime asset
        shell: bash
        env:
          SOURCE_PATH: resources/qwen-tts/${{ matrix.runtime-directory }}/${{ matrix.executable }}
          RELEASE_ASSET: ${{ matrix.release-asset }}
          RUNTIME_DIRECTORY: ${{ matrix.runtime-directory }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-assets
          cp "$SOURCE_PATH" "release-assets/$RELEASE_ASSET"
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { writeFileSync } = require('node:fs')

          const revision = (directory) =>
            execFileSync('git', ['-C', directory, 'rev-parse', 'HEAD'], {
              encoding: 'utf8'
            }).trim()
          const info = {
            schemaVersion: 1,
            runtimeDirectory: process.env.RUNTIME_DIRECTORY,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: {
              repository: 'https://github.com/predict-woo/qwen3-tts.cpp',
              revision: revision('.cache/qwen3-tts.cpp'),
              ggmlRevision: revision('.cache/qwen3-tts.cpp/ggml')
            }
          }
          writeFileSync(
            `release-assets/build-info-${process.env.RUNTIME_DIRECTORY}.json`,
            `${JSON.stringify(info, null, 2)}\n`
          )
          NODE

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-tts-runtime-${{ matrix.runtime-directory }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  model:
    name: Build Q8_0 model package
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.15.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Validate release version
        shell: bash
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$BUNDLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid bundle version: $BUNDLE_VERSION"
            exit 1
          fi

      - name: Install package-builder dependencies
        run: yarn install --immutable --mode=skip-build
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Fetch pinned converter source
        shell: bash
        env:
          QWEN_CPP_REVISION: b3ba14077cf1b3e11b86e5f84aa9184605c89b28
        run: |
          mkdir -p .cache/qwen3-tts.cpp
          git -C .cache/qwen3-tts.cpp init
          git -C .cache/qwen3-tts.cpp remote add origin https://github.com/predict-woo/qwen3-tts.cpp.git
          git -C .cache/qwen3-tts.cpp fetch --depth 1 origin "$QWEN_CPP_REVISION"
          git -C .cache/qwen3-tts.cpp checkout --detach FETCH_HEAD
          test "$(git -C .cache/qwen3-tts.cpp rev-parse HEAD)" = "$QWEN_CPP_REVISION"

      - name: Install pinned conversion dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            huggingface-hub==0.36.2 safetensors==0.8.0 numpy==2.4.6 tqdm==4.70.0 gguf==0.19.0

      - name: Download pinned Base model
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_HUB_DISABLE_TELEMETRY: 1
          MODEL_REVISION: 5d83992436eae1d760afd27aff78a71d676296fc
        run: |
          python <<'PYTHON'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="Qwen/Qwen3-TTS-12Hz-0.6B-Base",
              revision=os.environ["MODEL_REVISION"],
              local_dir=Path(".cache/qwen3-tts.cpp/models/Qwen3-TTS-12Hz-0.6B-Base"),
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "model.safetensors",
                  "tokenizer_config.json",
                  "vocab.json",
                  "merges.txt",
                  "preprocessor_config.json",
                  "speech_tokenizer/*",
              ],
          )
          PYTHON

      - name: Convert model to GGUF
        shell: bash
        run: |
          python .cache/qwen3-tts.cpp/scripts/convert_tts_to_gguf.py \
            --input .cache/qwen3-tts.cpp/models/Qwen3-TTS-12Hz-0.6B-Base \
            --output .cache/qwen3-tts.cpp/models/qwen3-tts-0.6b-q8_0.gguf \
            --type q8_0
          python .cache/qwen3-tts.cpp/scripts/convert_tokenizer_to_gguf.py \
            --input .cache/qwen3-tts.cpp/models/Qwen3-TTS-12Hz-0.6B-Base \
            --output .cache/qwen3-tts.cpp/models/qwen3-tts-tokenizer-f16.gguf \
            --type f16

      - name: Build model package
        shell: bash
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          MODEL_REVISION: 5d83992436eae1d760afd27aff78a71d676296fc
        run: |
          mkdir -p release-assets
          node scripts/build-qwen-tts-package.mjs \
            --model-dir .cache/qwen3-tts.cpp/models \
            --voice american-woman=native/qwen-tts/voices/american-woman.spk \
            --voice-name american-woman="American English Woman" \
            --version "$BUNDLE_VERSION" \
            --output "release-assets/qwen3-tts-0.6b-base-q8_0-$BUNDLE_VERSION.zip"
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const { readFileSync, statSync, writeFileSync } = require('node:fs')

          const modelPackage = `release-assets/qwen3-tts-0.6b-base-q8_0-${process.env.BUNDLE_VERSION}.zip`
          const packageBytes = statSync(modelPackage).size
          if (packageBytes >= 2 * 1024 ** 3) {
            throw new Error(`Model package exceeds GitHub's 2 GiB asset limit: ${packageBytes}`)
          }
          const info = {
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_COMMIT,
            modelRevision: process.env.MODEL_REVISION,
            qwenCppRevision: execFileSync(
              'git',
              ['-C', '.cache/qwen3-tts.cpp', 'rev-parse', 'HEAD'],
              { encoding: 'utf8' }
            ).trim(),
            speakerSha256: createHash('sha256')
              .update(readFileSync('native/qwen-tts/voices/american-woman.spk'))
              .digest('hex'),
            packageBytes
          }
          writeFileSync('release-assets/model-build-info.json', `${JSON.stringify(info, null, 2)}\n`)
          console.log(`Built ${modelPackage} (${packageBytes} bytes)`)
          NODE

      - name: Stage license notices
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/QwenLM/Qwen3-TTS/022e286b98fbec7e1e916cb940cdf532cd9f488e/LICENSE \
            --output release-assets/LICENSE.Qwen3-TTS.txt
          echo "a44a6081c73ad75f0255bb2bb5cab74ef1829565a895a24e53a4f11290ab7655  release-assets/LICENSE.Qwen3-TTS.txt" \
            | sha256sum --check
          cp thirdparty-licenses/LICENSE.qwen3-tts-cpp.txt release-assets/
          cp thirdparty-licenses/LICENSE.ggml.txt release-assets/

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-tts-model-package
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish Qwen TTS release
    needs: [build, model]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: qwen-tts-*
          path: release-assets
          merge-multiple: true

      - name: Generate pinned release manifest
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: qwen-tts-v${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs')
          const path = require('node:path')

          const directory = 'release-assets'
          const buildInfoFiles = readdirSync(directory)
            .filter((name) => name.startsWith('build-info-') && name.endsWith('.json'))
            .sort()
          if (buildInfoFiles.length !== 2) {
            throw new Error(`Expected two build-info files, found ${buildInfoFiles.length}`)
          }
          const buildInfo = buildInfoFiles.map((name) =>
            JSON.parse(readFileSync(path.join(directory, name), 'utf8'))
          )
          const first = buildInfo[0]
          for (const current of buildInfo.slice(1)) {
            if (
              current.sourceCommit !== first.sourceCommit ||
              current.upstream.revision !== first.upstream.revision ||
              current.upstream.ggmlRevision !== first.upstream.ggmlRevision
            ) {
              throw new Error('Platform builds used different source revisions')
            }
          }
          const modelInfo = JSON.parse(
            readFileSync(path.join(directory, 'model-build-info.json'), 'utf8')
          )
          if (
            modelInfo.sourceCommit !== first.sourceCommit ||
            modelInfo.qwenCppRevision !== first.upstream.revision
          ) {
            throw new Error('Runtime and model package used different source revisions')
          }

          const runtimeFiles = readdirSync(directory)
            .filter((name) => name.startsWith('ls101-qwen-tts-helper-'))
            .sort()
          if (runtimeFiles.length !== 2) {
            throw new Error(`Expected two runtime assets, found ${runtimeFiles.length}`)
          }
          const modelFiles = readdirSync(directory)
            .filter((name) => /^qwen3-tts-.*\.zip$/.test(name))
            .sort()
          if (modelFiles.length !== 1) {
            throw new Error(`Expected one model package, found ${modelFiles.length}`)
          }
          const sha256 = (file) =>
            execFileSync('sha256sum', [file], { encoding: 'utf8' }).split(/\s+/, 1)[0]
          const assets = runtimeFiles.map((name) => {
            const file = path.join(directory, name)
            const runtimeDirectory = name.includes('-win32-') ? 'win32-x64' : 'linux-x64'
            return {
              kind: 'native-runtime',
              runtimeDirectory,
              name,
              size: statSync(file).size,
              sha256: sha256(file)
            }
          })
          for (const name of modelFiles) {
            const file = path.join(directory, name)
            assets.push({
              kind: 'model-package',
              name,
              size: statSync(file).size,
              sha256: sha256(file)
            })
          }
          const licenseFiles = readdirSync(directory)
            .filter((name) => name.startsWith('LICENSE.') && name.endsWith('.txt'))
            .sort()
          if (licenseFiles.length !== 3) {
            throw new Error(`Expected three license files, found ${licenseFiles.length}`)
          }
          for (const name of licenseFiles) {
            const file = path.join(directory, name)
            assets.push({
              kind: 'license',
              name,
              size: statSync(file).size,
              sha256: sha256(file)
            })
          }
          const manifest = {
            schemaVersion: 1,
            bundleVersion: process.env.BUNDLE_VERSION,
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstream: {
              ...first.upstream,
              model: 'Qwen/Qwen3-TTS-12Hz-0.6B-Base',
              modelRevision: modelInfo.modelRevision
            },
            speakerSha256: modelInfo.speakerSha256,
            assets
          }
          writeFileSync(
            path.join(directory, 'qwen-tts-release-manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          )
          NODE
          cd release-assets
          sha256sum \
            ls101-qwen-tts-helper-* \
            qwen3-tts-*.zip \
            LICENSE.*.txt \
            qwen-tts-release-manifest.json > SHA256SUMS
          cat qwen-tts-release-manifest.json
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: qwen-tts-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Qwen TTS v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: false
          generate_release_notes: false
          body: |
            CPU-only native helpers and the Qwen3-TTS 12Hz 0.6B Base Q8_0 model package.

            Runtime, model, voice, source revisions, sizes, and hashes are recorded in
            `qwen-tts-release-manifest.json`.
          files: |
            release-assets/ls101-qwen-tts-helper-*
            release-assets/qwen3-tts-*.zip
            release-assets/LICENSE.*.txt
            release-assets/qwen-tts-release-manifest.json
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
