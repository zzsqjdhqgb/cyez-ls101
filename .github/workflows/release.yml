name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  actions: read
  contents: read

jobs:
  quality-gate:
    name: Require successful main CI
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Tag commit ($GITHUB_SHA) is not contained in main"
            exit 1
          fi
          echo "Tag commit $GITHUB_SHA is contained in main."

      - name: Require successful CI for tag commit
        uses: actions/github-script@v8
        with:
          script: |
            const runQuery = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              per_page: 100
            }
            const startDeadline = Date.now() + 5 * 60 * 1000
            const completionDeadline = Date.now() + 90 * 60 * 1000
            while (Date.now() < completionDeadline) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, runQuery)
              const successfulRun = runs.find(
                (run) => run.status === 'completed' && run.conclusion === 'success'
              )
              if (successfulRun) {
                core.info(`Quality gate passed in ${successfulRun.html_url}`)
                return
              }

              const activeRun = runs.find((run) => run.status !== 'completed')
              if (!activeRun && runs.length > 0) {
                const failedRun = runs[0]
                core.setFailed(
                  `CI concluded ${failedRun.conclusion} for tag commit ${context.sha}: ${failedRun.html_url}`
                )
                return
              }
              if (!activeRun && Date.now() >= startDeadline) {
                core.setFailed(`No main push CI run started for tag commit ${context.sha}`)
                return
              }

              core.info(
                activeRun
                  ? `Waiting for CI run ${activeRun.html_url} (${activeRun.status})`
                  : 'Waiting for the main push CI run to start'
              )
              await new Promise((resolve) => setTimeout(resolve, 60_000))
            }
            core.setFailed(`Timed out waiting for CI on tag commit ${context.sha}`)

  build:
    name: Build and publish release
    needs: quality-gate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 拉取触发 workflow 的 Tag 对应提交
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # 安装 Node 24 (已移除 cache 选项，交由下方手动缓存处理)
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 启用 Corepack 并激活项目所需的 Yarn 4.15.0
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.15.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      # 动态获取 Yarn v4 (Berry) 的缓存目录
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      # 手动配置 actions/cache，绕过 setup-node 在 Windows 下的缓存 Bug
      - name: Cache Yarn dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # 验证触发的 Tag（去掉首字母 v）是否与该提交的 package.json 版本一致
      - name: Validate version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version validation passed."

      # 安装依赖
      - name: Install dependencies
        run: yarn install --immutable

      # 打包 Release
      - name: Build release
        run: yarn build:release

      # 创建 Release 并上传制品
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
