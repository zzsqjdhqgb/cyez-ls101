components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExamId:
      name: examId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientVersion:
      name: X-LS101-Client-Version
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LocalAuthorization:
      name: X-LS101-Local-Authorization
      in: header
      description: Required for loopback password-free sessions; single-use proof from protected local IPC.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ArchiveDigest:
      name: X-LS101-Archive-SHA256
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Digest'
    TaskLease:
      name: X-LS101-Task-Lease
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Query:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Room:
      name: room
      in: query
      schema:
        type: string
        maxLength: 200
    From:
      name: from
      in: query
      description: Inclusive timestamp; receivedAt for submissions.
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      description: Exclusive timestamp; receivedAt for submissions.
      schema:
        type: string
        format: date-time
  requestBodies:
    ExamArchive:
      required: true
      content:
        application/x-ls101-exam:
          schema:
            type: string
            format: binary
    SubmissionArchive:
      required: true
      content:
        application/x-ls101-submission:
          schema:
            type: string
            format: binary
  responses:
    Error:
      description: >-
        400 INVALID_REQUEST; 401 AUTH_REQUIRED/TOKEN_EXPIRED/TOKEN_REVOKED; 403
        DEVICE_DISABLED/LICENSE_INACTIVE/ENROLLMENT_REJECTED; 404 NOT_FOUND; 409
        SERVICE_MAINTENANCE/VERSION_MISMATCH/REVISION_CONFLICT/CONTENT_CONFLICT/RESOURCE_BUSY; 413
        PAYLOAD_TOO_LARGE; 415 UNSUPPORTED_MEDIA_TYPE; 422 INVALID_EXAM/INVALID_SUBMISSION; 429
        RATE_LIMITED; 503 SERVICE_NOT_READY/STORAGE_UNAVAILABLE. Current authorization is checked
        even on replay.
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          description: Whole seconds before retry; does not imply a submission was not received.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExamArchive:
      description: Original complete exam archive; no range protocol.
      headers:
        Content-Length:
          schema:
            type: integer
            minimum: 0
        Content-Disposition:
          schema:
            type: string
        X-LS101-Archive-SHA256:
          schema:
            $ref: '#/components/schemas/Digest'
        X-Request-Id:
          schema:
            type: string
      content:
        application/x-ls101-exam:
          schema:
            type: string
            format: binary
    SubmissionArchive:
      description: Original complete submission archive.
      headers:
        Content-Length:
          schema:
            type: integer
            minimum: 0
        Content-Disposition:
          schema:
            type: string
        X-LS101-Archive-SHA256:
          schema:
            $ref: '#/components/schemas/Digest'
        X-Request-Id:
          schema:
            type: string
      content:
        application/x-ls101-submission:
          schema:
            type: string
            format: binary
  schemas:
    PositiveInteger:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Count:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    NullableDigest:
      type: string
      nullable: true
      pattern: ^[a-f0-9]{64}$
    NullableLabel:
      type: string
      nullable: true
      maxLength: 200
    NullableTime:
      type: string
      format: date-time
      nullable: true
    Ids:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
    Revision:
      type: object
      required:
        - revision
      properties:
        revision:
          $ref: '#/components/schemas/PositiveInteger'
      additionalProperties: false
    Page:
      type: object
      required:
        - nextCursor
      properties:
        nextCursor:
          type: string
          nullable: true
    Info:
      type: object
      required:
        - serverId
        - name
        - apiVersion
        - releaseVersion
        - serverTime
        - readiness
      properties:
        serverId:
          type: string
          format: uuid
        name:
          type: string
        apiVersion:
          type: integer
          enum:
            - 1
        releaseVersion:
          type: string
        serverTime:
          type: string
          format: date-time
        readiness:
          type: string
          enum:
            - ready
            - initializing
            - upgrading
            - unavailable
            - license-inactive
    SessionRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      additionalProperties: false
    Session:
      type: object
      required:
        - token
        - expiresAt
        - serverId
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        serverId:
          type: string
          format: uuid
    PasswordUpdate:
      type: object
      required:
        - newPassword
        - expectedRevision
      properties:
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        expectedRevision:
          $ref: '#/components/schemas/PositiveInteger'
      additionalProperties: false
    ModeUpdate:
      type: object
      required:
        - mode
        - expectedRevision
      properties:
        mode:
          type: string
          enum:
            - normal
            - maintenance
        expectedRevision:
          type: integer
          minimum: 1
      additionalProperties: false
    Mode:
      type: object
      required:
        - mode
        - modeRevision
      properties:
        mode:
          type: string
          enum:
            - normal
            - maintenance
        modeRevision:
          $ref: '#/components/schemas/PositiveInteger'
    Blocker:
      type: object
      required:
        - kind
        - resourceId
      properties:
        kind:
          type: string
          enum:
            - enrollment
            - test-run
            - history-cleanup
            - lease
            - backup
        resourceId:
          type: string
          format: uuid
    ServiceState:
      allOf:
        - $ref: '#/components/schemas/Info'
        - $ref: '#/components/schemas/Mode'
        - type: object
          required:
            - openEnrollment
            - activeTasks
            - blockers
            - deviceSummary
            - storage
          properties:
            openEnrollment:
              type: string
              format: uuid
              nullable: true
            activeTasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            blockers:
              type: array
              items:
                $ref: '#/components/schemas/Blocker'
            deviceSummary:
              type: object
              required:
                - total
                - online
                - versionMismatch
                - practicing
                - unknownStatistics
              properties:
                total:
                  $ref: '#/components/schemas/Count'
                online:
                  $ref: '#/components/schemas/Count'
                versionMismatch:
                  $ref: '#/components/schemas/Count'
                practicing:
                  $ref: '#/components/schemas/Count'
                unknownStatistics:
                  $ref: '#/components/schemas/Count'
            storage:
              $ref: '#/components/schemas/StorageSummary'
    Device:
      type: object
      required:
        - id
        - number
        - room
        - seat
        - displayName
        - enabled
        - revision
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          minLength: 1
          maxLength: 64
        room:
          $ref: '#/components/schemas/NullableLabel'
        seat:
          $ref: '#/components/schemas/NullableLabel'
        displayName:
          $ref: '#/components/schemas/NullableLabel'
        enabled:
