openapi: 3.0.3
info:
  title: LS101 Lab Server API
  version: 1.0.0-draft
  description: 机房服务端 API 基线。详细规则以 lab-server-api-design.md 为准；本文件用于 生成共享类型、检查路径覆盖和验证请求响应形状。
servers:
  - url: https://{host}:{port}/api/v1
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '8443'
security: []
tags:
  - name: public
  - name: teacher
  - name: student
paths:
  /info:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getInfo
      tags:
        - public
      responses:
        '200':
          description: Service information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/sessions:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    post:
      operationId: postTeacherSessions
      parameters:
        - $ref: '#/components/parameters/LocalAuthorization'
      tags:
        - teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Request-Id:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /teacher/sessions/current:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    delete:
      operationId: deleteTeacherSessionsCurrent
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/security:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherSecurity
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/security/password:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    put:
      operationId: putTeacherSecurityPassword
      tags:
        - teacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdate'
      responses:
        '200':
          description: Updated revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
          headers:
            X-Request-Id:
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /teacher/service:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherService
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceState'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/service/mode:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    put:
      operationId: putTeacherServiceMode
      tags:
        - teacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeUpdate'
      responses:
        '200':
          description: Updated mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
          headers:
            X-Request-Id:
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /student/state:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getStudentState
      tags:
        - student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current student state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentState'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/heartbeat:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    post:
      operationId: postStudentHeartbeat
      tags:
        - student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Heartbeat result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
          headers:
            X-Request-Id:
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /teacher/devices:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherDevices
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Room'
        - $ref: '#/components/parameters/Query'
        - name: online
          in: query
          schema:
            type: boolean
        - name: versionMismatch
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/devices/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTeacherDevicesId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchTeacherDevicesId
      tags:
        - teacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          headers:
            X-Request-Id:
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /teacher/devices/{id}/reset-binding:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: postTeacherDevicesIdResetBinding
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Binding reset; device identity and history retained
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/enrollments:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherEnrollments
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Enrollment batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: postTeacherEnrollments
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreate'
      responses:
        '201':
          description: Batch created and maintenance entered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreated'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/enrollments/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteTeacherEnrollmentsId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Closed without changing mode
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/enrollments/{id}/file:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTeacherEnrollmentsIdFile
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed enrollment JWS
          content:
            application/jose:
              schema:
                type: string
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /enrollment/devices/{installationId}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: installationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: putEnrollmentDevicesInstallationId
      tags:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '200':
          description: Existing registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredDevice'
          headers:
            X-Request-Id:
              schema:
                type: string
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredDevice'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/exams:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherExams
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Query'
        - name: published
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Exams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: postTeacherExams
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArchiveDigest'
      requestBody:
        $ref: '#/components/requestBodies/ExamArchive'
      responses:
        '200':
          description: Identical existing exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamImport'
          headers:
            X-Request-Id:
              schema:
                type: string
        '201':
          description: Imported and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamImport'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/ExamId'
    get:
      operationId: getTeacherExamsExamId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exam metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchTeacherExamsExamId
      tags:
        - teacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - published
                - expectedRevision
              additionalProperties: false
              properties:
                published:
                  type: boolean
                expectedRevision:
                  $ref: '#/components/schemas/PositiveInteger'
      responses:
        '200':
          description: Updated exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTeacherExamsExamId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Exam deleted; grants and submissions retained
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/exams/{examId}/archive:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/ExamId'
    get:
      operationId: getTeacherExamsExamIdArchive
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ExamArchive'
        default:
          $ref: '#/components/responses/Error'
  /student/exams:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getStudentExams
      tags:
        - student
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Published exams in normal mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentExamList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/exams/{examId}/archive:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/ExamId'
    get:
      operationId: getStudentExamsExamIdArchive
      tags:
        - student
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ExamArchive'
        default:
          $ref: '#/components/responses/Error'
  /student/practices/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/SubmissionId'
    put:
      operationId: putStudentPracticesSubmissionId
      tags:
        - student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
      responses:
        '200':
          description: Same unexpired grant after current authorization check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeGrant'
          headers:
            X-Request-Id:
              schema:
                type: string
        '201':
          description: New start grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeGrant'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/submissions/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/SubmissionId'
    put:
      operationId: putStudentSubmissionsSubmissionId
      tags:
        - student
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArchiveDigest'
      requestBody:
        $ref: '#/components/requestBodies/SubmissionArchive'
      responses:
        '200':
          description: Original receipt including deletion tombstone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedReceipt'
          headers:
            X-Request-Id:
              schema:
                type: string
        '201':
          description: Durably received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Received'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/submissions/{submissionId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/SubmissionId'
    get:
      operationId: getStudentSubmissionsSubmissionIdReceipt
      tags:
        - student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned submission result; normal mode only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptQuery'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/submissions:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getTeacherSubmissions
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Room'
        - name: examId
          in: query
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: candidateId
          in: query
          schema:
            type: string
        - name: candidateName
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Received submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/submissions/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTeacherSubmissionsId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Submission metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTeacherSubmissionsId
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logically deleted; original receipt retained
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /teacher/submissions/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTeacherSubmissionsIdArchive
      tags:
        - teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SubmissionArchive'
        default:
          $ref: '#/components/responses/Error'
  /teacher/submissions/export:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    post:
      operationId: postTeacherSubmissionsExport
      tags:
        - teacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionSelection'
      responses:
        '200':
          description: Complete outer ZIP containing original submission packages
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /teacher/submissions/delete:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    post:
      operationId: postTeacherSubmissionsDelete
      tags:
        - teacher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionSelection'
      responses:
        '200':
          description: Per-item outcomes for fixed selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteResult'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/tasks:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getStudentTasks
      tags:
        - student
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Currently claimable tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/tasks/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: postStudentTasksIdClaim
      tags:
        - student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtimeId
              additionalProperties: false
              properties:
                runtimeId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Lease bound to this runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLease'
          headers:
            X-Request-Id:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /student/tasks/{id}/lease:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: putStudentTasksIdLease
      tags:
        - student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - runtimeId
                - leaseId
              additionalProperties: false
              properties:
                runtimeId:
                  type: string
                  format: uuid
                leaseId:
                  type: string
                  format: uuid
      responses:
        '200':
