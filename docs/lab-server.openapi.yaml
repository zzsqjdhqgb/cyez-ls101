        lastHeartbeatAt:
          $ref: '#/components/schemas/NullableTime'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseResult'
        confirmation:
          $ref: '#/components/schemas/Confirmation'
        report:
          type: object
          nullable: true
          required:
            - leaseId
            - status
            - completedAt
          properties:
            leaseId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/TaskState'
            completedAt:
              type: string
              format: date-time
        late:
          type: boolean
    TestRun:
      type: object
      required:
        - id
        - suiteId
        - suiteVersion
        - createdAt
        - expiresAt
        - status
        - retryOf
        - devices
      properties:
        id:
          type: string
          format: uuid
        suiteId:
          type: string
        suiteVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TaskState'
        retryOf:
          type: string
          format: uuid
          nullable: true
        devices:
          type: array
          items:
            $ref: '#/components/schemas/TestDeviceResult'
    TestRunList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TestRun'
    TestReport:
      allOf:
        - $ref: '#/components/schemas/TestRun'
        - type: object
          required:
            - serverId
            - releaseVersion
            - generatedAt
          properties:
            serverId:
              type: string
              format: uuid
            releaseVersion:
              type: string
            generatedAt:
              type: string
              format: date-time
    CleanupCreate:
      type: object
      required:
        - deviceIds
        - submittedBefore
        - expiresAt
      additionalProperties: false
      properties:
        deviceIds:
          $ref: '#/components/schemas/Ids'
        submittedBefore:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CleanupConfirm:
      type: object
      required:
        - expectedRevision
        - selections
      additionalProperties: false
      properties:
        expectedRevision:
          $ref: '#/components/schemas/PositiveInteger'
        selections:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - deviceId
              - selectionDigest
            additionalProperties: false
            properties:
              deviceId:
                type: string
                format: uuid
              selectionDigest:
                $ref: '#/components/schemas/Digest'
    CleanupDevice:
      type: object
      required:
        - deviceId
        - previewTaskId
        - executionTaskId
        - status
        - selectionDigest
        - selectedCount
        - selectedBytes
        - previewedAt
        - confirmed
        - result
        - error
      properties:
        deviceId:
          type: string
          format: uuid
        previewTaskId:
          type: string
          format: uuid
        executionTaskId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/TaskState'
        selectionDigest:
          $ref: '#/components/schemas/NullableDigest'
        selectedCount:
          type: integer
          minimum: 0
          nullable: true
        selectedBytes:
          type: integer
          minimum: 0
          nullable: true
        previewedAt:
          $ref: '#/components/schemas/NullableTime'
        confirmed:
          type: boolean
        result:
          oneOf:
            - $ref: '#/components/schemas/CleanupResult'
            - type: object
              nullable: true
              enum:
                - null
        error:
          $ref: '#/components/schemas/DiagnosticError'
    CleanupPlan:
      type: object
      required:
        - id
        - revision
        - status
        - createdAt
        - submittedBefore
        - expiresAt
        - devices
      properties:
        id:
          type: string
          format: uuid
        revision:
          $ref: '#/components/schemas/PositiveInteger'
        status:
          type: string
          enum:
            - previewing
            - awaiting-confirmation
            - executing
            - cancel-requested
            - succeeded
            - failed
            - cancelled
            - expired
        createdAt:
          type: string
          format: date-time
        submittedBefore:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        devices:
          type: array
          items:
            $ref: '#/components/schemas/CleanupDevice'
    CleanupList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CleanupPlan'
    StorageSummary:
      type: object
      required:
        - usedBytes
        - freeBytes
        - pendingGcBytes
      properties:
        usedBytes:
          $ref: '#/components/schemas/Count'
        freeBytes:
          $ref: '#/components/schemas/Count'
        pendingGcBytes:
          $ref: '#/components/schemas/Count'
    Settings:
      type: object
      required:
        - name
        - baseUrl
        - limits
        - revision
        - storage
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
          pattern: ^https://
        limits:
          $ref: '#/components/schemas/Limits'
        revision:
          $ref: '#/components/schemas/PositiveInteger'
        storage:
          $ref: '#/components/schemas/StorageSummary'
    SettingsPatch:
      type: object
      required:
        - expectedRevision
      minProperties: 2
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
          pattern: ^https://
        limits:
          $ref: '#/components/schemas/Limits'
        expectedRevision:
          $ref: '#/components/schemas/PositiveInteger'
    LogEntry:
      type: object
      required:
        - id
        - at
        - level
        - message
        - requestId
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        message:
          type: string
        requestId:
          type: string
          nullable: true
    LogList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LogEntry'
    Backup:
      type: object
      required:
        - id
        - status
        - createdAt
        - snapshotAt
        - releaseVersion
        - archiveBytes
        - archiveSha256
        - error
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - ready
            - failed
        createdAt:
          type: string
          format: date-time
        snapshotAt:
          $ref: '#/components/schemas/NullableTime'
        releaseVersion:
          type: string
        archiveBytes:
          type: integer
          minimum: 0
          nullable: true
        archiveSha256:
          $ref: '#/components/schemas/NullableDigest'
        error:
          $ref: '#/components/schemas/DiagnosticError'
    BackupList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Backup'
    ErrorDetails:
      type: object
      description: Only known diagnostic fields; never credentials or filesystem paths.
      additionalProperties: false
      properties:
        revision:
          $ref: '#/components/schemas/PositiveInteger'
        modeRevision:
          $ref: '#/components/schemas/PositiveInteger'
        mode:
          type: string
          enum:
            - normal
            - maintenance
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        expectedReleaseVersion:
          type: string
        actualReleaseVersion:
          type: string
        field:
          type: string
        limit:
          $ref: '#/components/schemas/Count'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTH_REQUIRED
            - TOKEN_EXPIRED
            - TOKEN_REVOKED
            - DEVICE_DISABLED
            - LICENSE_INACTIVE
            - ENROLLMENT_REJECTED
            - NOT_FOUND
            - SERVICE_MAINTENANCE
            - VERSION_MISMATCH
            - REVISION_CONFLICT
            - CONTENT_CONFLICT
            - RESOURCE_BUSY
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INVALID_EXAM
            - INVALID_SUBMISSION
            - RATE_LIMITED
            - SERVICE_NOT_READY
            - STORAGE_UNAVAILABLE
        message:
          type: string
        requestId:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    Error:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
